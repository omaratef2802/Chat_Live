name: Chat Live Backend Checks
on:
  push:
    branches: [refrence-chatpgt]
    paths: ["backend/**", ".github/workflows/chat-live-backend-tests.yml"]
  pull_request:
    paths: ["backend/**"]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm test
